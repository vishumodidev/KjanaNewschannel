services:
  # ── MySQL 8 Database ─────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: jananews_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-jananews_db}
      MYSQL_USER: ${DB_USER:-jananews}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db-init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Adminer (database GUI for development) ───────────────────────────
  adminer:
    image: adminer:latest
    container_name: jananews_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha

  # ── Express 5 API Server ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: jananews_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-jananews}:${DB_PASSWORD:-devpassword}@db:3306/${DB_NAME:-jananews_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-production-super-secret-key-needs-64-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production-super-refresh-key-needs-64-characters-long}

volumes:
  mysql_data:
    name: jananews_mysql_data

